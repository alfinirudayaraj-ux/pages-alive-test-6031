<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="description" content="ARENA — the premium Free Fire community, tournaments, live streams and account marketplace." />
<title>ARENA · Free Fire Community</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/nav.css" />
<link rel="stylesheet" href="styles/components.css" />
<link rel="stylesheet" href="styles/screens.css" />
<link rel="stylesheet" href="styles/animations.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient__blob ambient__blob--a"></span>
    <span class="ambient__blob ambient__blob--b"></span>
    <span class="ambient__blob ambient__blob--c"></span>
    <div class="ambient__grain"></div>
  </div>

  <div class="shell">
    <header class="topbar" id="topbar">
      <a class="brand" href="#" data-nav="home" aria-label="ARENA home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M16 2 30 9.6v12.8L16 30 2 22.4V9.6L16 2Z" stroke="currentColor" stroke-width="1.4"/><path d="M16 9.4 23.6 22H8.4L16 9.4Z" fill="currentColor"/></svg>
        </span>
        <span class="brand__word">ARENA</span>
        <span class="brand__beta">PRO</span>
      </a>

      <div class="topbar__actions">
        <button class="iconbtn" id="btnSearch" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" id="btnInbox" aria-label="Messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.6 3.6V16H6.5A2.5 2.5 0 0 1 4 13.5v-7Z" stroke-linejoin="round"/></svg>
          <span class="iconbtn__dot" id="inboxDot"></span>
        </button>
        <button class="avatarbtn" id="btnStudio" aria-label="Studio &amp; settings">
          <span class="avatarbtn__img" id="meAvatar">RV</span>
          <span class="avatarbtn__halo" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main id="app" class="app" role="main"></main>
  </div>

  <nav class="dock" id="dock" aria-label="Primary">
    <span class="dock__glass" aria-hidden="true"></span>
    <span class="dock__indicator" id="dockIndicator" aria-hidden="true"></span>
    <button class="dock__item" data-nav="community" aria-label="Communities">
      <span class="dock__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><circle cx="9" cy="8.2" r="3.1"/><path d="M3.2 19.4c.5-3 2.9-4.7 5.8-4.7s5.3 1.7 5.8 4.7" stroke-linecap="round"/><circle cx="17.2" cy="9.4" r="2.2"/><path d="M16 14.9c2.5-.2 4.4 1.3 4.8 3.9" stroke-linecap="round"/></svg>
      </span>
      <span class="dock__label">Community</span>
    </button>
    <button class="dock__item dock__item--center" data-nav="home" aria-label="Videos and streams">
      <span class="dock__halo" aria-hidden="true"></span>
      <span class="dock__icon dock__icon--center">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2.6" y="5" width="18.8" height="14" rx="4.2" stroke="currentColor" stroke-width="1.55"/><path d="M10.4 9.4v5.2l4.6-2.6-4.6-2.6Z" fill="currentColor"/></svg>
      </span>
      <span class="dock__label">Studio</span>
    </button>
    <button class="dock__item" data-nav="store" aria-label="Store">
      <span class="dock__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><path d="M4.2 8.4h15.6l-1.1 10.3a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8L4.2 8.4Z" stroke-linejoin="round"/><path d="M8.6 8.4V6.6a3.4 3.4 0 0 1 6.8 0v1.8" stroke-linecap="round"/></svg>
      </span>
      <span class="dock__label">Store</span>
    </button>
  </nav>

  <div class="sheet-layer" id="sheetLayer" aria-live="polite"></div>
  <div class="toaster" id="toaster" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
